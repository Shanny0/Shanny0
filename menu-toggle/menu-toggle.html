<!--
  Burger -> X menu toggle. Paste the whole thing into a Webflow Embed, inside the Navbar's
  menu button (Navbar > Menu Button). It works anywhere else too.

  Inside a Webflow Navbar it makes itself passive: Webflow keeps handling the click, and the
  icon just mirrors the navbar's open state, so the two never fight over it. On a plain page
  it drives itself instead, toggling .is-open and keeping aria-expanded in sync.

  Restyle with the custom properties on .burger: --size, --color, --speed.
  The second <style> block at the bottom is the navbar layout - delete it if you don't
  want it.
-->
<style>
  .burger {
    --size: 44px;
    --color: #FBF9EF;
    --speed: 420ms;
    --ease: cubic-bezier(.34, 1.4, .5, 1);      /* a little overshoot on the swing */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    line-height: 0;
    -webkit-tap-highlight-color: transparent;
    transition: transform 160ms ease;
  }
  .burger:active { transform: scale(.92); }
  .burger:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 4px;
    border-radius: 6px;
  }
  /* inside Webflow's menu button the click belongs to Webflow, so let it pass through */
  .burger.is-passive { pointer-events: none; cursor: inherit; }
  .burger svg { width: var(--size); height: auto; display: block; overflow: visible; }
  .burger svg path {
    fill: var(--color);
    transform-box: fill-box;                     /* every piece turns around its own centre */
    transform-origin: center;
    transition: transform var(--speed) var(--ease),
                opacity calc(var(--speed) * .45) ease;
  }

  /* closing: the buns swing back first, the filling drops in after them */
  .burger .patty { transition-delay: 130ms; }
  .burger .bun,
  .burger .base  { transition-delay: 0ms; }

  /* opening: the filling shoots out first, then the buns cross */
  .burger.is-open .patty { transition-delay: 0ms; }
  .burger.is-open .bun,
  .burger.is-open .base  { transition-delay: 70ms; }

  .burger.is-open .bun   { transform: translate(-.7px, 9.7px) rotate(45deg) scale(.92, .36); }
  .burger.is-open .base  { transform: translate(.3px, -17px) rotate(-45deg) scaleX(.92); }
  .burger.is-open .patty { transform: scale(.15); opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .burger, .burger svg path { transition-duration: 1ms; transition-delay: 0ms; }
  }
</style>

<button class="burger" type="button" data-burger aria-label="Open menu" aria-expanded="false">
  <svg viewBox="0 0 45 43" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <path class="bun" d="M41.3711 10.8564C46.1709 19.7298 40.5063 22.5851 36.8855 22.9414C36.7436 22.9553 36.6025 22.9539 36.4604 22.9427L21.8401 21.784L7.23209 20.4791C7.09014 20.4664 6.95071 20.4442 6.8132 20.4066C3.30308 19.4493 -1.8036 15.6861 4.41376 7.74137C10.6299 0.645196 20.6265 1.71722 23.5278 1.76054C26.3955 2.20348 36.4305 2.81989 41.3711 10.8564Z"/>
    <path class="base" d="M42.1614 40.3978L42.8598 38.2249C43.4234 36.4717 42.1157 34.6777 40.2741 34.6777H3.85409C1.97585 34.6777 0.664552 36.5385 1.29627 38.3073L2.07228 40.4801C2.45834 41.5611 3.48226 42.2827 4.6301 42.2827H39.5757C40.7555 42.2827 41.8004 41.521 42.1614 40.3978Z"/>
    <path class="patty" d="M2.71559 25H11.2271C11.5225 25 11.8123 25.0803 12.0656 25.2322L20.262 30.1501C20.8216 30.4859 21.5276 30.4554 22.0562 30.0726L28.6335 25.3097C28.9116 25.1084 29.2461 25 29.5893 25H41.2835C42.1835 25 42.9131 25.7296 42.9131 26.6296V30.7045C42.9131 31.6042 42.1839 32.3337 41.2842 32.3341L2.71641 32.3521C1.8161 32.3525 1.08603 31.6228 1.08602 30.7225L1.08596 26.6297C1.08595 25.7296 1.81556 25 2.71559 25Z"/>
  </svg>
</button>

<script>
(function () {
  function setOpen(btn, open) {
    btn.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }

  document.querySelectorAll('[data-burger]').forEach(function (btn) {
    var nav = btn.closest('.w-nav');
    var wfBtn = nav && nav.querySelector('.w-nav-button');

    if (wfBtn) {
      // --- inside a Webflow Navbar: Webflow owns the click, we only follow along ---
      if (wfBtn.contains(btn)) {
        btn.classList.add('is-passive');           // let the click reach Webflow's button
        btn.setAttribute('tabindex', '-1');
        btn.setAttribute('aria-hidden', 'true');
      } else {
        btn.addEventListener('click', function () { wfBtn.click(); });
      }

      var menu = nav.querySelector('.w-nav-menu');
      var sync = function () {
        setOpen(btn, wfBtn.classList.contains('w--open') ||
                     !!(menu && menu.hasAttribute('data-nav-menu-open')));
      };
      new MutationObserver(sync).observe(wfBtn, { attributes: true, attributeFilter: ['class'] });
      if (menu) { new MutationObserver(sync).observe(menu, { attributes: true }); }
      sync();

      // the overlay starts below the navbar, so the menu centres in what is left of the
      // screen rather than in a full-height box that hangs off the bottom
      var setNavHeight = function () {
        document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
      };
      setNavHeight();
      window.addEventListener('resize', setNavHeight);
      return;
    }

    // --- anywhere else: the button drives itself ---
    btn.addEventListener('click', function () {
      var open = !btn.classList.contains('is-open');
      setOpen(btn, open);

      var sel = btn.getAttribute('data-burger-target');
      if (sel) {
        var target = document.querySelector(sel);
        if (target) { target.classList.toggle('is-open', open); }
      }
      btn.dispatchEvent(new CustomEvent('burger:toggle', {
        bubbles: true, detail: { open: open }
      }));
    });
  });
})();
</script>

<!-- Navbar layout: hides Webflow's own menu icon and centres the open menu. Delete this
     block to leave your navbar exactly as it is. 991px is Webflow's tablet breakpoint,
     where the navbar collapses. -->
<style>
  .w-nav-button .w-icon-nav-menu { display: none !important; }
  .w-nav-button { display: inline-flex; align-items: center; justify-content: center; }

  @media screen and (max-width: 991px) {
    .w-nav-overlay { height: auto; }
    .w-nav-overlay .w-nav-menu,
    .w-nav[data-collapse] .w-nav-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: calc(100vh - var(--nav-h, 0px));
      min-height: calc(100dvh - var(--nav-h, 0px));
      text-align: center;
    }
  }
</style>
