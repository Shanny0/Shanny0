<!--
  Burger -> X menu toggle, Lottie version. Paste the whole thing into a Webflow Embed,
  inside the Navbar's menu button (Navbar > Menu Button).

  Use this instead of Webflow's Lottie element, not next to it: the native element autoplays
  on load, which leaves it resting on the X. This one loads the same file, holds frame 0 (the
  burger), and plays to the X only when the menu opens - reversing from wherever it got to if
  you tap again mid-flight. The animation is inlined below, so there is no file to upload and
  no interaction to set up.

  Options on the div: data-size="44" (px), data-color="#FBF9EF".
  The second <style> block at the bottom is the navbar layout - delete it if you don't
  want it.
-->
<style>
  .burger-lottie {
    --size: 44px;
    width: var(--size);
    aspect-ratio: 45 / 43;
    display: inline-block;
    line-height: 0;
    cursor: pointer;
  }
  .burger-lottie svg { display: block; width: 100% !important; height: 100% !important; }
  /* inside Webflow's menu button the click belongs to Webflow, so let it pass through */
  .burger-lottie.is-passive { pointer-events: none; cursor: inherit; }
</style>

  function recolour(doc, hex) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');

    var rgb = [parseInt(m[1], 16) / 255, parseInt(m[2], 16) / 255, parseInt(m[3], 16) / 255, 1];

      (layer.shapes || []).forEach(function each(shape) {
        if (shape.ty === 'fl') { shape.c.k = rgb; }
        if (shape.it) { shape.it.forEach(each); }
      });
    });
    return doc;
  }

<!-- Navbar layout: hides Webflow's own menu icon and centres the open menu. Delete this

    .w-nav-overlay .w-nav-menu,
    .w-nav[data-collapse] .w-nav-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: calc(100vh - var(--nav-h, 0px));
      min-height: calc(100dvh - var(--nav-h, 0px));
      text-align: center;
    }
  }
</style>
