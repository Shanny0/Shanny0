    b.onclick = () => anim.setSpeed(parseFloat(b.dataset.speed)));
  document.getElementById('bg').onclick = e => {
    document.body.classList.toggle('light');
    e.target.textContent = document.body.classList.contains('light') ? 'dark' : 'light';
  };
</script>
</body>
</html>
