<div id="xceed-widget"></div>
<script>
// Xceed ticket widget: load it only when the tickets section gets close, so it does not slow the first load
(function () {
  var box = document.getElementById("xceed-widget"), done = false;
  // When the widget starts up it scrolls the page down to itself. For 10 s after loading it:
  // 1) the widget cannot take focus until it is on screen (focus makes the browser scroll to it),
  // 2) page-scroll calls that would move the page by 400px+ are ignored (unless a key or link tap started them),
  // 3) as a last resort, a jump that still happens is undone.
  function holdScroll() {
    var W = window, P = Element.prototype, H = HTMLElement.prototype, until = Date.now() + 10000, lastKey = 0, lastClick = 0;
    var orig = { to: W.scrollTo, by: W.scrollBy, sc: W.scroll, into: P.scrollIntoView, focus: H.focus };
    function onKey() { lastKey = Date.now(); }
    function onClick() { lastClick = Date.now(); }
    function guarding() { var n = Date.now(); return n < until && n - lastKey > 1000 && n - lastClick > 1500; }
    function far(y) { return Math.abs(y - W.scrollY) > 400; }
    function toY(a, b) { return a && typeof a === "object" ? (a.top != null ? a.top : W.scrollY) : (b != null ? b : W.scrollY); }
    W.scrollTo = function (a, b) { if (guarding() && far(toY(a, b))) return; return orig.to.apply(W, arguments); };
    W.scroll = function (a, b) { if (guarding() && far(toY(a, b))) return; return orig.sc.apply(W, arguments); };
    W.scrollBy = function (a, b) {
      var dy = a && typeof a === "object" ? (a.top || 0) : (b || 0);
      if (guarding() && Math.abs(dy) > 400) return; return orig.by.apply(W, arguments);
    };
    P.scrollIntoView = function () {
      if (guarding() && Math.abs(this.getBoundingClientRect().top) > 400) return; return orig.into.apply(this, arguments);
    };
    H.focus = function () {
      if (guarding() && box.contains(this)) return orig.focus.call(this, { preventScroll: true }); return orig.focus.apply(this, arguments);
    };
    // no focus inside the widget until it is actually on screen
    if ("inert" in box && "IntersectionObserver" in W) {
      box.inert = true;
      var seen = new IntersectionObserver(function (e) { if (e[0].isIntersecting) { seen.disconnect(); box.inert = false; } });
      seen.observe(box);
    }
    // last resort: undo a sudden 400px+ jump the visitor did not start
    var y = W.scrollY;
    function onScroll() { if (guarding() && far(y) && Math.abs(W.scrollY - y) > 400) orig.to.call(W, 0, y); else y = W.scrollY; }
    W.addEventListener("keydown", onKey, true);
    W.addEventListener("click", onClick, true);
    W.addEventListener("scroll", onScroll, { passive: true });
    setTimeout(function () {
      W.scrollTo = orig.to; W.scrollBy = orig.by; W.scroll = orig.sc; P.scrollIntoView = orig.into; H.focus = orig.focus;
      W.removeEventListener("keydown", onKey, true);
      W.removeEventListener("click", onClick, true);
      W.removeEventListener("scroll", onScroll);
    }, 10000);
  }
  // The widget reads its own page from the URL after "#" (#/events...). The site's in-page links (#tickets, #line-up,
  // #faq) also write there, and the widget then shows its 404 page: keep those links out of the URL.
  function clearHash() {
    if (location.hash && !/^#\//.test(location.hash)) history.replaceState(history.state, "", location.pathname + location.search);
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[href*=\"#\"]");
    if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;
    var url = new URL(a.getAttribute("href"), location.href);
    if (url.pathname !== location.pathname || url.hash.length < 2 || /^#\//.test(url.hash)) return;
    var target = document.getElementById(decodeURIComponent(url.hash.slice(1)));
    if (!target) return;
    e.preventDefault();
    var nav = document.querySelector(".nav_component");
    var off = nav && /fixed|sticky/.test(getComputedStyle(nav).position) ? nav.offsetHeight : 0;
    (document.scrollingElement || document.documentElement).scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - off, behavior: "smooth" });
    setTimeout(clearHash, 0); // in case another link handler still wrote the hash
  }, true);
  function load() {
    if (done) return;
    done = true;
    clearHash();
    holdScroll();
    var s = document.createElement("script");
    s.src = "https://widget.xceed.me/v2/loader.js";
    document.body.appendChild(s);
  }
  if (!box || !("IntersectionObserver" in window)) return load();
  var io = new IntersectionObserver(function (e) {
    if (e[0].isIntersecting) { io.disconnect(); load(); }
  }, { rootMargin: "1500px 0px" });
  io.observe(box);
})();
</script>
