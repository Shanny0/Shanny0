<!-- ASSAULT: loading guard + always open at the top (blocks auto-jumps from the Xceed widget) -->
<script>
(function () {
  document.documentElement.classList.add('is-loading');
  // Failsafe: if the external scripts (Slater) never arrive, show the hero anyway
  setTimeout(function () { document.documentElement.classList.remove('is-loading'); }, 5000);
  // Pages without the Home intro (legal pages) show the header straight away
  document.addEventListener('DOMContentLoaded', function () {
    if (!document.querySelector('.section_hero')) document.documentElement.classList.remove('is-loading');
  });
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  // The Xceed ticket widget keeps its own route in the URL (#/events...): drop it so a reload opens the Home at the top
  if (/^#\//.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  if (location.hash) return;
  var user = false, until = Date.now() + 8000;
  ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(function (ev) {
    addEventListener(ev, function () { user = true; }, { passive: true, capture: true });
  });
  addEventListener('scroll', function () {
    if (!user && Date.now() < until && window.scrollY > 0) window.scrollTo(0, 0);
  }, { passive: true });
  addEventListener('load', function () { if (!user) window.scrollTo(0, 0); });
})();
</script>
